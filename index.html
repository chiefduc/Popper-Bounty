<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popper Bounty</title>
    <meta name="description" content="Post a claim with the observations that would refute it. GenLayer validators audit the conditions and judge challenges against public sources.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div id="demo-banner" class="demo-banner" hidden>
      Simulated chain: validators here are keyword checks, not language models, and nothing is written to GenLayer.
    </div>
    <header class="bar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.2 19C16.4 17 15.8 13.4 15.1 10.4 14.4 7.2 14.9 4 17.4 3.3 19.1 2.9 20.4 3.9 20.7 5.3L23.8 7.6 20.4 7C19.6 6.6 18.5 6.8 18.1 7.8 17.5 9.2 18.1 12.1 18.9 14.6 19.5 16.5 19.8 18 19.7 19.3 23.6 19.4 28 20.6 28 23.2 28 26.4 24 28 18 28H10.2C5.2 28 2 24.6 1.6 18 5 20.4 10.2 20.9 15.2 19Z"/></svg>
        Popper Bounty
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav>Claims</a>
        <a href="#/new" data-nav>Post a claim</a>
      </nav>
      <button class="account" data-open-settings type="button">
        <span id="network" class="net"></span>
        <span id="account" class="addr"></span>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
    <aside id="tray" class="tray" hidden></aside>
    <dialog id="settings" aria-labelledby="settings-h">
      <div class="dlg-head">
        <h2 id="settings-h">Settings</h2>
        <button id="settings-close" class="x" type="button" aria-label="Close settings">×</button>
      </div>
      <div id="settings-body"></div>
    </dialog>
    <footer class="foot">
      <p>Claims and verdicts live on GenLayer. Bounties are recorded amounts; no funds are held.</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
